name: 🛠️ Build Vortex-X APK

# کی اجرا بشه؟
on:
  push:
    branches: [ main, master ]   # با هر پوش روی این برنچ‌ها
  workflow_dispatch:             # + دکمه‌ی اجرای دستی در گیتهاب

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ───────────── ۱. دریافت سورس ─────────────
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive   # برای hev-socks5-tunnel اگه submodule باشه

      # ───────────── ۲. پیدا کردن خودکار ریشه پروژه ─────────────
      # 💡 این مرحله دقیقاً مشکل قبلی تو رو حل می‌کنه!
      - name: 🔍 Detect Project Root
        id: root
        run: |
          FILE=$(find . -maxdepth 3 -name "settings.gradle*" \
                 -not -path "*/build/*" \
                 -not -path "*/.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "❌ settings.gradle not found in repo!"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "✅ Project root detected: $DIR"

      # ───────────── ۳. نصب JDK 17 ─────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ───────────── ۴. نصب Android SDK + NDK ─────────────
      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Install NDK & CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # ───────────── ۵. Gradle 8.7 با کش (سرعت ×۳) ─────────────
      - name: 🐘 Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ───────────── ۶. ساخت موتور تانل ─────────────
      - name: 🔌 Build hev-socks5-tunnel (tunnel engine)
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          if [ -f "build-tunnel.sh" ]; then
            chmod +x build-tunnel.sh && ./build-tunnel.sh
          elif [ -d "hev-socks5-tunnel" ]; then
            cd hev-socks5-tunnel && make || echo "⚠️ tunnel make skipped"
          else
            echo "ℹ️ No standalone tunnel build needed"
          fi

      # ───────────── ۷. ساخت APK ─────────────
      - name: 📱 Build Debug APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # ───────────── ۸. تغییر نام APK ─────────────
      - name: ✏️ Rename APK
        if: success()
        run: |
          mkdir -p output
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK" "output/VortexX-debug-${{ github.run_number }}.apk"
          ls -lh output/

      # ───────────── ۹. آپلود خروجی ─────────────
      - name: 📤 Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VortexX-Debug-APK
          path: output/*.apk
          retention-days: 30
