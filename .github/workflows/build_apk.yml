name: 🛠️ Build Vortex-X APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Extract Project ZIP
        run: |
          sudo apt-get install -y unzip
          unzip -o "VortexX-Project (2).zip" -d extracted
          find extracted -maxdepth 3 -type d

      - name: 🔍 Detect Project Root
        id: root
        run: |
          FILE=$(find ./extracted -name "settings.gradle*" -not -path "*/build/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "❌ settings.gradle not found!"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "✅ Project root: $DIR"

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Locate SDK & Accept Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | head -n 1)
          echo "sdkmanager path: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: ⚙️ Install NDK & CMake
        run: |
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 🐘 Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 📱 Build Debug APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: ✏️ Rename APK
        if: success()
        run: |
          mkdir -p output
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK" "output/VortexX-debug-${{ github.run_number }}.apk"

      - name: 📤 Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VortexX-Debug-APK
          path: output/*.apk
