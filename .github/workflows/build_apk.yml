name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK (NDK 26.1.10909125)
        shell: bash
        run: |
          SDKMANAGER_DIR=$(dirname $(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1))
          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" > /dev/null

      - name: Build hev-socks5-tunnel (tunnel engine)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/heiher/hev-socks5-tunnel.git hev
          cd hev
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          export NDK_HOME="$ANDROID_NDK_HOME"
          ./build-android-arm64.sh || true
          ./build-android-arm.sh || true
          ./build-android-x86_64.sh || true
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          copy_so() {
            local so="$1"; local abi="$2"
            if [ -f "$so" ]; then cp "$so" "app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"; echo "copied $abi"; fi
          }
          copy_so "hev/bin/arm64-v8a/libhev-socks5-tunnel.so" "arm64-v8a"
          copy_so "hev/bin/armeabi-v7a/libhev-socks5-tunnel.so" "armeabi-v7a"
          copy_so "hev/bin/x86_64/libhev-socks5-tunnel.so" "x86_64"
          for f in $(find hev -name "libhev-socks5-tunnel.so" 2>/dev/null); do
            case "$f" in
              *arm64-v8a*) copy_so "$f" "arm64-v8a";;
              *armeabi-v7a*) copy_so "$f" "armeabi-v7a";;
              *x86_64*) copy_so "$f" "x86_64";;
            esac
          done
          ls -la app/src/main/jniLibs/*/

      - name: Build Debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Vortex-X.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-X-Debug-apk
          path: Vortex-X.apk
